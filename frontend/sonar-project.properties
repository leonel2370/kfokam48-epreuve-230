# Analyse SonarQube du frontend (#103) : projet distinct du backend, sinon les deux analyses s'écraseraient.
# Lancement (depuis frontend/, .env chargé) : voir docs/PLAN_TECHNIQUE_EQUIPES.md §2 ter.
sonar.projectKey=kfokam48-epreuve-230-frontend
