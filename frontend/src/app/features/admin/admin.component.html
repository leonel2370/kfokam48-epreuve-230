<main>
  <section class="carte">
    <h2>Promotions</h2>
    @if (messagePromotions(); as m) { <output class="succes">{{ m }}</output> }
    @for (p of promotions(); track p.id) {
      <p class="ligne">
        <strong>{{ p.nom }}</strong>
        <app-bouton-navigation variante="secondaire" [chemin]="cheminTableau(p.id)">Tableau</app-bouton-navigation>
        <app-bouton-navigation variante="secondaire" [chemin]="cheminSessions" [parametres]="parametresSessions(p.id)">
          Sessions
        </app-bouton-navigation>
        <button type="button" class="secondaire" (click)="gerer(p)">Gérer</button>
        <button type="button" class="secondaire" [disabled]="ecriture.enCours()" (click)="renommerPromotion(p)">
          Renommer
        </button>
        <button type="button" class="secondaire" [disabled]="ecriture.enCours()" (click)="supprimerPromotion(p)">
          Supprimer
        </button>
      </p>
    }
    <app-etat-liste [lecture]="lecturePromotions" [nombre]="promotions().length" vide="Aucune promotion." />
    <form class="ligne" (ngSubmit)="creerPromotion()">
      <label>
        Nouvelle promotion
        <input name="nomPromotionCreation" [(ngModel)]="nomPromotionCreation" required
               [attr.maxlength]="longueurNomPromotion" />
      </label>
      <button type="submit" class="secondaire" [disabled]="ecriture.enCours() || !nomPromotionCreation.trim()">
        Créer la promotion
      </button>
    </form>
    <app-erreur [erreur]="erreurPromotions()" />
  </section>

  @if (promotionSelectionnee(); as p) {
    <app-gestion-promotion [promotion]="p" />
  }

  <app-liste-comptes />

  <app-creation-compte [promotions]="promotions()" (cree)="compteCree()" />
</main>
