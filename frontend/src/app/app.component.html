<header>
  <div class="entete">
    <span class="marque">{{ titre }}</span>
    @if (auth.profil(); as moi) {
      <app-barre-navigation libelle="Menus" [entrees]="menus()" />
      <app-bouton-navigation [chemin]="chemins.profil" titre="Mon profil">
        {{ moi.nomAffiche }} · {{ libelleDuRole(moi.role) }}
      </app-bouton-navigation>
      <button type="button" class="secondaire" (click)="deconnecter()">Se déconnecter</button>
    }
  </div>
</header>
<router-outlet />
