<header>
  <nav aria-label="Menus">
    <a routerLink="/" class="marque">{{ titre }}</a>
    @if (auth.profil(); as moi) {
      @for (m of menus(); track m.lien) {
        <a [routerLink]="m.lien" routerLinkActive="actif">{{ m.libelle }}</a>
      }
      <a routerLink="/profil" routerLinkActive="actif" title="Mon profil">{{ moi.nomAffiche }} · {{ moi.role }}</a>
      <button class="secondaire" (click)="deconnecter()">Se déconnecter</button>
    }
  </nav>
</header>
<router-outlet />
