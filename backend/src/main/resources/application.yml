# Aucun secret ici : les valeurs viennent de l'environnement (.env à la racine, voir .env.example).
spring:
  application:
    name: presence48
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/presence48}
    username: ${DB_USERNAME:presence48}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate          # B5 : le schéma appartient à Flyway
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false              # le format d'erreur est {code, message} (contrat)

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true         # ENF11 : cookie de session inaccessible au JavaScript
        same-site: strict
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

# Swagger UI (#96) : http://localhost:8080/swagger-ui.html — le contrat de référence d'abord, puis la doc générée.
springdoc:
  swagger-ui:
    urls:
      - name: Contrat (référence)
        url: /contrat.yaml
      - name: Implémentation (générée)
        url: /v3/api-docs
    urls-primary-name: Contrat (référence)
