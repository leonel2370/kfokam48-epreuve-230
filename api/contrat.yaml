openapi: 3.0.3
info:
  title: Contrat PRESENCE48 — Épreuve finale KFOKAM48
  version: "2.8"
  description: |
    Les cinq opérations imposées (tag « imposé ») existent EXACTEMENT ainsi :
    mêmes chemins, verbes, codes de statut nominaux et format d'erreur.

    Ajouts sur les opérations imposées (tous justifiés dans docs/CAHIER_DES_CHARGES.md §7) :
      - POST /api/presences      : 429 TROP_DE_TENTATIVES (Q4, HYP-5) ; 409 SESSION_CLOTUREE (RG18)
      - POST /api/exercices      : 409 SESSION_CLOTUREE (RG18) ; 404 non ajouté, les identifiants inconnus renvoient 400
      - POST /api/relectures/{id}: en-tête X-Etudiant-Id (HYP-2) ; 403 RELECTEUR_NON_ASSIGNE ;
                                   404 RELECTURE_INTROUVABLE ; 409 SESSION_CLOTUREE
    Les corps de requête et de réponse imposés ne sont pas modifiés.

    Toutes les autres opérations (tag « complément ») sont propres à ce projet.

    v2.8 (#134, décisions PO #140) — L'ADMINISTRATION LIT CE QU'ELLE MODIFIE
      - Nouvelles lectures, PRÉVUES (x-livre: false tant que le code n'est pas fusionné) :
        GET /api/promotions/{promotionId}/formateurs (ADMIN) et GET /api/promotions/{promotionId}/fiches
        (ADMIN, FORMATEUR de la promotion : toutes les fiches, désactivées comprises, avec leur compte).
        La liste publique GET /api/promotions/{promotionId}/etudiants ne change pas (RG22).
      - GET /api/utilisateurs : filtre « role » ; 400 pour une pagination hors bornes (#132).
      - PUT /api/promotions/{promotionId}/formateurs : liste vide acceptée (plus aucun formateur) ;
        404 UTILISATEUR_INTROUVABLE ; 400 ROLE_INCOMPATIBLE (compte non FORMATEUR ou désactivé).
      - Comptes : 400 MOT_DE_PASSE_TROP_FAIBLE effectivement renvoyé ; 400 ETUDIANT_INCONNU pour une
        fiche inexistante ; 409 FICHE_DEJA_LIEE (au lieu de LOGIN_DEJA_UTILISE) pour une fiche déjà liée.
      - Fiches étudiants : 409 DEPLACEMENT_IMPOSSIBLE si la fiche a un historique (RG32) ; la
        désactivation d'une fiche désactive aussi son compte (RG34) ; une fiche désactivée n'est plus
        tirée au sort comme relectrice (RG33, sans effet sur les corps imposés).
    v2.7 (#61) — GESTION DU RÉFÉRENTIEL (SF-21, SF-22, EF22, EF23)
      - Les 7 opérations de gestion du référentiel sont livrées : créer/renommer/supprimer une
        promotion (ADMIN, RG25 ; nom unique → 409 CONFLIT ; RG28 : suppression refusée si
        étudiants ou sessions), rattacher les formateurs d'une promotion (ADMIN, RG26 : seuls des
        comptes FORMATEUR), créer/modifier/supprimer une fiche étudiant (ADMIN et FORMATEUR de
        la promotion, RG26 ; suppression physique sans historique, désactivation sinon — RG28).
    v2.6 (#60) — CRUD DES COMPTES (ADMIN)
      - Les 6 opérations /api/utilisateurs sont livrées (SF-20, EF21) : liste paginée, création
        (mot de passe provisoire RG23, login unique RG27), lecture, modification, désactivation
        (RG28, dernier admin actif protégé), réinitialisation de mot de passe (RG23/RG24).
    v2.5 (#112) — RÉCAPITULATIF DE L'ÉTUDIANT CONNECTÉ
      - GET /api/moi/recap est livré : ligne de tableau (EF10) de l'étudiant connecté, même calcul
        agrégé que le tableau ; 403 pour un compte non étudiant (SF-17).
    v2.4 (#113) — UNE FICHE DÉSACTIVÉE NE PEUT PLUS AGIR
      - POST /api/presences et POST /api/exercices refusent une fiche étudiant désactivée :
        403 ETUDIANT_DESACTIVE (RG28), contrôlé avant les autres règles.
    v2.3 (#111) — ÉTAT DE LA LIVRAISON
      - Chaque opération porte x-livre: true (livrée) ou x-livre: false + « Non livré (backlog #n) »
        en tête de son résumé : Swagger UI ne présente plus comme disponibles les 24 opérations
        des tickets non livrés (clôture, présence manuelle, remplacement de lien, CRUD, pièce jointe).
      - GET /api/sessions, GET /api/etudiants/{id}/exercices et /relectures : 401/403 déclarés ;
        400 ajouté sur les paramètres manquants (GET /api/sessions, GET /api/tableau).
      - Pendant un changement de mot de passe obligatoire (RG23), POST /api/auth/login reste permis.
    v2.2 (#98) — le schéma Session (GET /api/sessions, complément) renvoie code = null à un ETUDIANT.
    v2.1 (enveloppe, étape 3, #85) — DOUBLE RELECTURE
      - Deux relecteurs par exercice ; la note retenue est la moyenne des notes rendues, provisoire
        tant qu'un seul a rendu. Vue auteur (ExerciceAuteur) : noteRetenue, provisoire, commentaires.
      - Les cinq opérations imposées sont inchangées (même chemin, mêmes corps, mêmes codes).
    v2.0 (changement de besoin #54) — SÉCURITÉ
      - Session serveur : cookie JSESSIONID (HttpOnly, SameSite=Strict) obtenu par POST /api/auth/login.
      - Routes PUBLIQUES (security: []) : les 5 opérations imposées, /api/auth/login et les deux listes
        de sélection (GET /api/promotions, GET /api/promotions/{promotionId}/etudiants). Sans session,
        les opérations imposées se comportent exactement comme en v1 (B2).
      - AVEC une session, les opérations imposées appliquent en plus les contrôles de rôle, de
        promotion (RG26) et d'identité (403 IDENTITE_DIFFERENTE, ACCES_REFUSE).
      - Toutes les autres routes exigent la session (401 NON_AUTHENTIFIE) et, en écriture,
        l'en-tête X-XSRF-TOKEN recopié du cookie XSRF-TOKEN (sinon 403 ACCES_REFUSE).
      - Un compte dont le mot de passe doit être changé (RG23) reçoit 403 CHANGEMENT_MOT_DE_PASSE_REQUIS
        partout sauf GET /api/moi, PUT /api/moi/mot-de-passe, POST /api/auth/logout et POST /api/auth/login
        (permis pour se (re)connecter ; sans session, aucune route n'est bloquée par RG23).
    Dates : ISO-8601 avec fuseau (UTC).

security:
  - cookieAuth: []   # v2 : session obligatoire par défaut ; les routes publiques déclarent security: []

servers:
  - url: http://localhost:8080

tags:
  - name: securite
    description: v2 — connexion, profil, mot de passe
  - name: administration
    description: v2 — CRUD par profil (comptes, promotions, étudiants, sessions)
  - name: exercice
    description: v2 — pièce jointe d'exercice
  - name: imposé
    description: Opérations imposées par le sujet (Annexe B), inchangées
  - name: complément
    description: Opérations ajoutées pour les écrans (docs/SPECIFICATIONS_FONCTIONNELLES.md)

paths:

  # ------------------------------------------------------------------ Référentiel
  /api/promotions:
    post:
      x-livre: true
      tags: [administration]
      operationId: creerPromotion
      summary: Créer une promotion (ADMIN, SF-21)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionEcriture" }
      responses:
        "201":
          description: Promotion créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "400": { $ref: "#/components/responses/Erreur" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }   # CONFLIT (nom déjà pris)
    get:
      x-livre: true
      security: []
      operationId: listerPromotions
      tags: [complément]
      summary: Liste des promotions (sélection à l'écran, EF1)
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Promotion" }

  /api/promotions/{promotionId}/etudiants:
    get:
      x-livre: true
      security: []
      operationId: listerEtudiantsPromotion
      tags: [complément]
      summary: Étudiants d'une promotion, pour choisir son nom (Q1, EF1)
      parameters:
        - $ref: "#/components/parameters/PromotionId"
      responses:
        "200":
          description: Étudiants triés par nom
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Etudiant" }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ------------------------------------------------------------------ Sessions
  /api/sessions:
    post:
      x-livre: true
      security: []
      operationId: ouvrirSession
      tags: [imposé]
      summary: Le formateur ouvre une session et obtient un code de présence (EF2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT, PROMOTION_INCONNUE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE (v2, avec une session d'un autre rôle ou hors promotion)
    get:
      x-livre: true
      operationId: listerSessions
      tags: [complément]
      summary: Sessions d'une promotion, plus récentes d'abord
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT (promotionId manquant ou non numérique)
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE (v2, avec une session : étudiant, ou formateur hors promotion)
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions/{sessionId}/cloture:
    post:
      x-livre: false
      operationId: cloturerSession
      tags: [complément]
      summary: "Non livré (backlog #32) — Le formateur clôture la session (EF12, HYP-1, RG18)"
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INTROUVABLE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/sessions/{sessionId}/presences:
    post:
      x-livre: false
      operationId: ajouterPresenceManuelle
      tags: [complément]
      summary: "Non livré (backlog #30) — Le formateur ajoute une présence à la main (EF5, Q14, RG15)"
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId]
              properties:
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée avec source FORMATEUR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Presence" }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT, ETUDIANT_INCONNU, ETUDIANT_HORS_PROMOTION
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INTROUVABLE
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT, SESSION_CLOTUREE

  /api/sessions/{sessionId}/exercices:
    get:
      x-livre: false
      operationId: listerExercicesSession
      tags: [complément]
      summary: "Non livré (backlog #31) — Exercices d'une session avec statut et relecteur, vue formateur (EF11, Q11, HYP-9)"
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Exercices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExerciceFormateur" }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INTROUVABLE

  # ------------------------------------------------------------------ Présence
  /api/presences:
    post:
      x-livre: true
      security: []
      operationId: marquerPresence
      tags: [imposé]
      summary: Un étudiant marque sa présence avec le code (EF3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU, CHAMP_MANQUANT, ETUDIANT_INCONNU, ETUDIANT_HORS_PROMOTION
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT, SESSION_CLOTUREE
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE
        "403": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_DESACTIVE (#113, RG28) ; IDENTITE_DIFFERENTE (v2, uniquement avec une session)
        "429": { $ref: "#/components/responses/Erreur" }   # TROP_DE_TENTATIVES (ajout, Q4)

  # ------------------------------------------------------------------ Exercices
  /api/exercices:
    post:
      x-livre: true
      security: []
      operationId: deposerExercice
      tags: [imposé]
      summary: "Un étudiant dépose le lien de son exercice (EF6) ; déclenche le tirage du relecteur (EF7) ; statut = DEPOSE (aucun relecteur disponible) ou EN_ATTENTE_RELECTURE"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE, CHAMP_MANQUANT, SESSION_INTROUVABLE, ETUDIANT_INCONNU, ETUDIANT_HORS_PROMOTION
        "403": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_DESACTIVE (#113, RG28) ; IDENTITE_DIFFERENTE (v2, uniquement avec une session)
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE, SESSION_CLOTUREE

  /api/exercices/{exerciceId}:
    put:
      x-livre: false
      operationId: remplacerLien
      tags: [complément]
      summary: "Non livré (backlog #33) — L'auteur remplace le lien tant que l'exercice n'est pas relu (EF13, Q13, RG14)"
      parameters:
        - name: exerciceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/EtudiantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciceAuteur" }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE, CHAMP_MANQUANT
        "403": { $ref: "#/components/responses/Erreur" }   # PAS_AUTEUR
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INTROUVABLE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_RELU, SESSION_CLOTUREE

  /api/etudiants/{etudiantId}/exercices:
    get:
      x-livre: true
      operationId: listerExercicesEtudiant
      tags: [complément]
      summary: Exercices de l'étudiant avec la note retenue, provisoire si un seul relecteur a rendu (EF14, Q8, RG16 v3, RG31)
      parameters:
        - $ref: "#/components/parameters/EtudiantId"
      responses:
        "200":
          description: Exercices de l'auteur
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExerciceAuteur" }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT (etudiantId manquant)
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # IDENTITE_DIFFERENTE (étudiant, #109) ou ACCES_REFUSE (hors promotion, RG26)
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU (formateur/admin seulement, #109)

  # ------------------------------------------------------------------ Relectures
  /api/etudiants/{etudiantId}/relectures:
    get:
      x-livre: true
      operationId: listerRelecturesEtudiant
      tags: [complément]
      summary: Relectures assignées à l'étudiant (EF8)
      parameters:
        - $ref: "#/components/parameters/EtudiantId"
        - name: statut
          in: query
          required: false
          schema: { type: string, enum: [A_FAIRE, RENDUE] }
      responses:
        "200":
          description: Relectures, sans l'identité de l'auteur (HYP-10)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RelectureRelecteur" }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT (etudiantId manquant)
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # IDENTITE_DIFFERENTE (étudiant, #109) ou ACCES_REFUSE (hors promotion, RG26)
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU (formateur/admin seulement, #109)

  /api/relectures/{id}:
    post:
      x-livre: true
      security: []
      operationId: rendreRelecture
      tags: [imposé]
      summary: Un relecteur rend sa note et son commentaire (EF9)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/EtudiantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE, CHAMP_MANQUANT
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE, RELECTEUR_NON_ASSIGNE, IDENTITE_DIFFERENTE (v2)
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INTROUVABLE (ajout)
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE, SESSION_CLOTUREE

  # ------------------------------------------------------------------ Tableau
  /api/tableau:
    get:
      x-livre: true
      security: []
      operationId: consulterTableau
      tags: [imposé]
      summary: Le tableau récapitulatif du formateur (EF10)
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT (promotionId manquant ou non numérique)
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE (v2, avec une session : étudiant, ou formateur hors promotion)
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ------------------------------------------------------------------ v2 : authentification et profil
  /api/auth/login:
    post:
      x-livre: true
      tags: [securite]
      operationId: connecter
      security: []
      summary: Se connecter (SF-15, EF15, EF18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, motDePasse]
              properties:
                login: { type: string }
                motDePasse: { type: string, format: password }
      responses:
        "200":
          description: Session ouverte (cookies JSESSIONID et XSRF-TOKEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profil" }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT
        "401": { $ref: "#/components/responses/Erreur" }   # IDENTIFIANTS_INVALIDES
        "403": { $ref: "#/components/responses/Erreur" }   # COMPTE_DESACTIVE
        "429": { $ref: "#/components/responses/Erreur" }   # TROP_DE_TENTATIVES

  /api/auth/logout:
    post:
      x-livre: true
      tags: [securite]
      operationId: deconnecter
      summary: "Se déconnecter (SF-16) — invalide la session côté serveur ; renvoie 204 même sans session (idempotent). Jeton CSRF exigé."
      responses:
        "204": { description: Session invalidée (ou déjà absente) }
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE (jeton CSRF absent)

  /api/moi:
    get:
      x-livre: true
      tags: [securite]
      operationId: monProfil
      summary: Profil de l'utilisateur connecté (SF-17, EF16)
      responses:
        "200":
          description: Qui suis-je
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profil" }
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE

  /api/moi/mot-de-passe:
    put:
      x-livre: true
      tags: [securite]
      operationId: changerMotDePasse
      summary: Changer son mot de passe (SF-18, EF17, RG23, RG24)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ancien, nouveau]
              properties:
                ancien: { type: string, format: password }
                nouveau: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Mot de passe changé }
        "400": { $ref: "#/components/responses/Erreur" }   # MOT_DE_PASSE_TROP_FAIBLE, CHAMP_MANQUANT
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE, IDENTIFIANTS_INVALIDES (ancien faux)

  /api/moi/recap:
    get:
      x-livre: true
      tags: [securite]
      operationId: monRecapitulatif
      summary: "Ligne de tableau de l'étudiant connecté (SF-17, #112)"
      responses:
        "200":
          description: Récapitulatif personnel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LigneTableau" }
        "401": { $ref: "#/components/responses/Erreur" }   # NON_AUTHENTIFIE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE (pas un étudiant)

  # ------------------------------------------------------------------ v2 : administration
  /api/utilisateurs:
    get:
      x-livre: true
      tags: [administration]
      operationId: listerUtilisateurs
      summary: "Lister les comptes (ADMIN, SF-20, #60)"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Taille"
        - name: role
          in: query
          required: false
          description: "Ne garder que les comptes de ce rôle (v2.8, #134) — par exemple les formateurs à rattacher"
          schema: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Page de comptes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageUtilisateurs" }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT (page, size ou role hors bornes, #132)
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE, CHANGEMENT_MOT_DE_PASSE_REQUIS
    post:
      x-livre: true
      tags: [administration]
      operationId: creerUtilisateur
      summary: "Créer un compte (ADMIN, EF21, #60) — mot de passe à changer à la première connexion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UtilisateurCreation" }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Utilisateur" }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT, MOT_DE_PASSE_TROP_FAIBLE, ETUDIANT_INCONNU
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }   # LOGIN_DEJA_UTILISE, FICHE_DEJA_LIEE

  /api/utilisateurs/{utilisateurId}:
    parameters:
      - $ref: "#/components/parameters/UtilisateurId"
    get:
      x-livre: true
      tags: [administration]
      operationId: lireUtilisateur
      summary: "Lire un compte (ADMIN, SF-20, #60)"
      responses:
        "200":
          description: Compte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Utilisateur" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # UTILISATEUR_INTROUVABLE
    put:
      x-livre: true
      tags: [administration]
      operationId: modifierUtilisateur
      summary: "Modifier nom, rôle, fiche étudiant, activation (ADMIN, SF-20, #60)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UtilisateurModification" }
      responses:
        "200":
          description: Compte modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Utilisateur" }
        "400": { $ref: "#/components/responses/Erreur" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }   # SUPPRESSION_IMPOSSIBLE (dernier admin actif)
    delete:
      x-livre: true
      tags: [administration]
      operationId: desactiverUtilisateur
      summary: "Désactiver un compte (ADMIN, RG28, #60) — jamais de suppression physique"
      responses:
        "204": { description: Compte désactivé }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }   # SUPPRESSION_IMPOSSIBLE (dernier admin actif)

  /api/utilisateurs/{utilisateurId}/reinitialiser-mot-de-passe:
    parameters:
      - $ref: "#/components/parameters/UtilisateurId"
    post:
      x-livre: true
      tags: [administration]
      operationId: reinitialiserMotDePasse
      summary: "Donner un mot de passe provisoire (ADMIN, SF-20, #60) — à changer à la connexion suivante"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motDePasseInitial]
              properties:
                motDePasseInitial: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Mot de passe réinitialisé }
        "400": { $ref: "#/components/responses/Erreur" }   # MOT_DE_PASSE_TROP_FAIBLE
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }

  /api/promotions/{promotionId}:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    put:
      x-livre: true
      tags: [administration]
      operationId: modifierPromotion
      summary: "Renommer une promotion (ADMIN, SF-21, #61)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionEcriture" }
      responses:
        "200":
          description: Promotion modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "400": { $ref: "#/components/responses/Erreur" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # CONFLIT (nom déjà pris)
    delete:
      x-livre: true
      tags: [administration]
      operationId: supprimerPromotion
      summary: "Supprimer une promotion vide (ADMIN, RG28, #61)"
      responses:
        "204": { description: Promotion supprimée }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }   # SUPPRESSION_IMPOSSIBLE

  /api/promotions/{promotionId}/formateurs:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    get:
      x-livre: false
      tags: [administration]
      operationId: listerFormateursDeLaPromotion
      summary: "Non livré (#134) — Formateurs rattachés à une promotion (ADMIN, RG26)"
      responses:
        "200":
          description: Comptes FORMATEUR rattachés, triés par nom affiché
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Utilisateur" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE
    put:
      x-livre: true
      tags: [administration]
      operationId: rattacherFormateurs
      summary: "Définir les formateurs d'une promotion (ADMIN, RG26, #61)"
      description: "Remplace la liste. Une liste vide retire tous les formateurs (v2.8)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utilisateurIds]
              properties:
                utilisateurIds:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "204": { description: Rattachements enregistrés }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT (identifiant nul), ROLE_INCOMPATIBLE
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE, UTILISATEUR_INTROUVABLE

  /api/promotions/{promotionId}/fiches:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    get:
      x-livre: false
      tags: [administration]
      operationId: listerFichesDeLaPromotion
      summary: "Non livré (#134) — Fiches étudiants d'une promotion pour la gestion (ADMIN, FORMATEUR de la promotion)"
      description: >
        Toutes les fiches, désactivées comprises (RG28), avec l'état et le compte lié.
        La liste publique GET /api/promotions/{promotionId}/etudiants reste limitée aux fiches actives.
      responses:
        "200":
          description: Fiches triées par nom
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FicheEtudiant" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/etudiants:
    post:
      x-livre: true
      tags: [administration]
      operationId: creerEtudiant
      summary: "Créer une fiche étudiant (ADMIN, FORMATEUR de la promotion, SF-22, #61)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EtudiantEcriture" }
      responses:
        "201":
          description: Fiche créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Etudiant" }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT, PROMOTION_INCONNUE
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }

  /api/etudiants/{etudiantId}:
    parameters:
      - $ref: "#/components/parameters/EtudiantId"
    put:
      x-livre: true
      tags: [administration]
      operationId: modifierEtudiant
      summary: "Modifier une fiche étudiant (ADMIN, FORMATEUR de la promotion, #61)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EtudiantEcriture" }
      responses:
        "200":
          description: Fiche modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Etudiant" }
        "400": { $ref: "#/components/responses/Erreur" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEPLACEMENT_IMPOSSIBLE (fiche avec historique, RG32)
    delete:
      x-livre: true
      tags: [administration]
      operationId: desactiverEtudiant
      summary: "Supprimer une fiche sans historique, sinon la désactiver (RG28, #61)"
      description: >
        Une fiche a un historique dès qu'elle a une présence, un exercice, une relecture, une tentative
        de code (#133) ou un compte lié. La désactiver désactive aussi son compte (RG34, v2.8).
      responses:
        "204": { description: Fiche supprimée ou désactivée }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }

  /api/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      x-livre: false
      tags: [administration]
      operationId: modifierSession
      summary: "Non livré (backlog #62) — Modifier le titre d'une session (FORMATEUR de la promotion, ADMIN, SF-23)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre]
              properties:
                titre: { type: string }
      responses:
        "200":
          description: Session modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Erreur" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INTROUVABLE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE
    delete:
      x-livre: false
      tags: [administration]
      operationId: supprimerSession
      summary: "Non livré (backlog #62) — Supprimer une session sans présence ni exercice (RG29)"
      responses:
        "204": { description: Session supprimée }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }   # SUPPRESSION_IMPOSSIBLE

  /api/presences/{presenceId}:
    delete:
      x-livre: false
      tags: [administration]
      operationId: supprimerPresenceManuelle
      summary: "Non livré (backlog #30) — Retirer une présence ajoutée à la main (FORMATEUR, source FORMATEUR, session non clôturée)"
      parameters:
        - name: presenceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Présence retirée }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE (présence de source ETUDIANT)
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  # ------------------------------------------------------------------ v2 : pièce jointe d'exercice
  /api/exercices/{exerciceId}/fichier:
    parameters:
      - name: exerciceId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      x-livre: false
      tags: [exercice]
      operationId: joindreFichier
      summary: "Non livré (backlog #63) — Joindre ou remplacer le fichier (ou .zip) de son exercice (ETUDIANT auteur, SF-24, RG30)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fichier]
              properties:
                fichier:
                  type: string
                  format: binary
                  description: 10 Mo max ; pdf, zip, txt, md, java, ts, png, jpg
      responses:
        "200":
          description: Fichier joint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciceAuteur" }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE (pas l'auteur)
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INTROUVABLE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_RELU, SESSION_CLOTUREE
        "413": { $ref: "#/components/responses/Erreur" }   # FICHIER_TROP_VOLUMINEUX
        "415": { $ref: "#/components/responses/Erreur" }   # TYPE_FICHIER_REFUSE
    get:
      x-livre: false
      tags: [exercice]
      operationId: telechargerFichier
      summary: "Non livré (backlog #63) — Télécharger la pièce jointe (auteur, relecteur assigné, formateur de la promotion, ADMIN)"
      responses:
        "200":
          description: Contenu du fichier (Content-Disposition attachment)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INTROUVABLE, FICHIER_INTROUVABLE
    delete:
      x-livre: false
      tags: [exercice]
      operationId: retirerFichier
      summary: "Non livré (backlog #63) — Retirer la pièce jointe tant que l'exercice n'est pas relu (auteur)"
      responses:
        "204": { description: Fichier retiré }
        "401": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_RELU

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: "Session obtenue par POST /api/auth/login. Écritures protégées : en-tête X-XSRF-TOKEN = cookie XSRF-TOKEN."
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Taille:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UtilisateurId:
      name: utilisateurId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PromotionId:
      name: promotionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EtudiantId:
      name: etudiantId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EtudiantHeader:
      name: X-Etudiant-Id
      in: header
      required: true
      description: |
        Identité de l'appelant (HYP-2). Publique sans session (RG22, opérations imposées) ; avec une
        session, ce doit être l'identifiant de l'étudiant connecté, sinon 403 IDENTITE_DIFFERENTE (v2).
        Absente ou non numérique → 400 CHAMP_MANQUANT.
      schema: { type: integer, format: int64 }

  schemas:
    Promotion:
      type: object
      required: [id, nom]
      properties:
        id: { type: integer, format: int64 }
        nom: { type: string }
    Etudiant:
      type: object
      required: [id, nom, promotionId]
      properties:
        id: { type: integer, format: int64 }
        nom: { type: string }
        promotionId: { type: integer, format: int64 }
    FicheEtudiant:
      description: "Fiche étudiant vue par ceux qui la gèrent (v2.8, #134)"
      type: object
      required: [id, nom, promotionId, actif]
      properties:
        id: { type: integer, format: int64 }
        nom: { type: string }
        promotionId: { type: integer, format: int64 }
        actif: { type: boolean, description: "false : fiche désactivée (RG28)" }
        compteLogin:
          type: string
          nullable: true
          description: "Identifiant du compte lié à la fiche, null si elle n'a pas de compte (HYP-15)"

    Session:
      type: object
      required: [id, titre, promotionId, code, ouvertureAt, expirationAt, statut]
      properties:
        id: { type: integer, format: int64 }
        titre: { type: string }
        promotionId: { type: integer, format: int64 }
        code:
          type: string
          nullable: true
          description: v2.2 (#98) — null pour un ETUDIANT ; le code se lit en salle (RG2)
        ouvertureAt: { type: string, format: date-time }
        expirationAt: { type: string, format: date-time }
        statut: { type: string, enum: [OUVERTE, CLOTUREE] }
        clotureAt: { type: string, format: date-time, nullable: true }
    Presence:
      type: object
      required: [id, sessionId, etudiantId, source]
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        etudiantId: { type: integer, format: int64 }
        source: { type: string, enum: [ETUDIANT, FORMATEUR] }
    StatutExercice:
      type: string
      enum: [DEPOSE, EN_ATTENTE_RELECTURE, RELU]
    ExerciceAuteur:
      description: Vue de l'auteur — jamais l'identité du relecteur (RG8)
      type: object
      required: [id, sessionId, sessionTitre, lien, statut]
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        sessionTitre: { type: string }
        lien: { type: string }
        statut: { $ref: "#/components/schemas/StatutExercice" }
        note: { type: integer, nullable: true, deprecated: true, description: "v2.1 — remplacé par noteRetenue (double relecture)" }
        commentaire: { type: string, nullable: true, deprecated: true, description: "v2.1 — remplacé par commentaires" }
        noteRetenue:
          type: number
          nullable: true
          description: v2.1 (enveloppe, #85) — moyenne des notes rendues par les deux relecteurs (RG16) ; null si aucune
        provisoire:
          type: boolean
          description: v2.1 — true si un seul des deux relecteurs a rendu (RG31)
        commentaires:
          type: array
          description: v2.1 — commentaires rendus, sans l'identité des relecteurs (RG8)
          items: { type: string }
        fichier: { $ref: "#/components/schemas/PieceJointe" }
    PieceJointe:
      description: v2 — pièce jointe optionnelle (RG30) ; absente si aucun fichier
      type: object
      nullable: true
      required: [nom, type, taille]
      properties:
        nom: { type: string }
        type: { type: string }
        taille: { type: integer, format: int64 }
    Profil:
      description: v2 — utilisateur connecté
      type: object
      required: [id, login, nomAffiche, role, doitChangerMotDePasse]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        nomAffiche: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        etudiantId: { type: integer, format: int64, nullable: true }
        promotionIds:
          type: array
          items: { type: integer, format: int64 }
        doitChangerMotDePasse: { type: boolean }
    Role:
      type: string
      enum: [ADMIN, FORMATEUR, ETUDIANT]
    Utilisateur:
      type: object
      required: [id, login, nomAffiche, role, actif]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        nomAffiche: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        etudiantId: { type: integer, format: int64, nullable: true }
        actif: { type: boolean }
        doitChangerMotDePasse: { type: boolean }
    UtilisateurCreation:
      type: object
      required: [login, nomAffiche, role, motDePasseInitial]
      properties:
        login: { type: string, maxLength: 50 }
        nomAffiche: { type: string, maxLength: 150 }
        role: { $ref: "#/components/schemas/Role" }
        motDePasseInitial: { type: string, format: password, minLength: 8 }
        etudiantId: { type: integer, format: int64, nullable: true, description: obligatoire si role = ETUDIANT }
    UtilisateurModification:
      type: object
      required: [nomAffiche, role, actif]
      properties:
        nomAffiche: { type: string, maxLength: 150 }
        role: { $ref: "#/components/schemas/Role" }
        actif: { type: boolean }
        etudiantId: { type: integer, format: int64, nullable: true }
    PageUtilisateurs:
      type: object
      required: [contenu, page, taille, total]
      properties:
        contenu:
          type: array
          items: { $ref: "#/components/schemas/Utilisateur" }
        page: { type: integer }
        taille: { type: integer }
        total: { type: integer, format: int64 }
    PromotionEcriture:
      type: object
      required: [nom]
      properties:
        nom: { type: string, maxLength: 100 }
    EtudiantEcriture:
      type: object
      required: [nom, promotionId]
      properties:
        nom: { type: string, maxLength: 150 }
        promotionId: { type: integer, format: int64 }
    LigneTableau:
      type: object
      required: [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
      properties:
        etudiantId: { type: integer, format: int64 }
        nom: { type: string }
        presences: { type: integer }
        exercicesDeposes: { type: integer }
        moyenne: { type: number, nullable: true }
        relecturesEnAttente: { type: integer }
    ExerciceFormateur:
      type: object
      required: [id, auteurId, auteurNom, lien, statut]
      properties:
        id: { type: integer, format: int64 }
        auteurId: { type: integer, format: int64 }
        auteurNom: { type: string }
        lien: { type: string }
        statut: { $ref: "#/components/schemas/StatutExercice" }
        relecteurId: { type: integer, format: int64, nullable: true }
        relecteurNom: { type: string, nullable: true }
        note: { type: integer, nullable: true }
    RelectureRelecteur:
      description: Vue du relecteur — sans l'identité de l'auteur (HYP-10)
      type: object
      required: [id, exerciceId, sessionTitre, lien, rendue]
      properties:
        id: { type: integer, format: int64 }
        exerciceId: { type: integer, format: int64 }
        sessionTitre: { type: string }
        lien: { type: string }
        rendue: { type: boolean }
        note: { type: integer, nullable: true }
        commentaire: { type: string, nullable: true }
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Identifiant stable, en majuscules. Catalogue complet :
            docs/SPECIFICATIONS_FONCTIONNELLES.md §5.
        message:
          type: string
          description: Phrase lisible par un humain, en français

  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
